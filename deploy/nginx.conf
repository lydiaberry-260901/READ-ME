# Nginx settings for the CRM. Copy to /etc/nginx/sites-available/moca-crm, change crm.moca.energy
# to the real address, then link it into sites-enabled. Certbot adds the HTTPS certificate lines.

# Limits on how often one address can try to sign in or send calls, to slow down attacks.
limit_req_zone $binary_remote_addr zone=moca_signin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=moca_webhook:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=moca_general:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name crm.moca.energy;

    # Uploads (CSV imports, transcripts, knowledge documents) up to 10 MB.
    client_max_body_size 12m;

    # Do not say which version of Nginx is running.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/auth/ {
        limit_req zone=moca_signin burst=10 nodelay;
        include /etc/nginx/snippets/moca-proxy.conf;
    }

    location = /two-step {
        limit_req zone=moca_signin burst=10 nodelay;
        include /etc/nginx/snippets/moca-proxy.conf;
    }

    location /api/transcripts/webhook {
        limit_req zone=moca_webhook burst=30 nodelay;
        include /etc/nginx/snippets/moca-proxy.conf;
    }

    location /_next/static/ {
        include /etc/nginx/snippets/moca-proxy.conf;
        # These files have a unique name each release, so browsers can keep them.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=moca_general burst=60 nodelay;
        include /etc/nginx/snippets/moca-proxy.conf;
    }
}
